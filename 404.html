<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Not found — Værksted</title>
  <meta name="description" content="Not in the workshop's inventory.">
  <meta name="theme-color" content="#0B0D11">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --void: #0B0D11;
      --frost: #EDEFF3;
      --mist: #8B939F;
      --line: rgba(237, 239, 243, 0.10);
      --line-strong: rgba(237, 239, 243, 0.20);
      --signal: #6C8CFF;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--void);
      color: var(--frost);
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(to right, var(--line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--line) 1px, transparent 1px);
      background-size: 72px 72px;
      -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 40%, #000 0%, transparent 75%);
      mask-image: radial-gradient(ellipse 70% 70% at 50% 40%, #000 0%, transparent 75%);
      opacity: 0.6;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 30%, rgba(108, 140, 255, 0.10) 0%, transparent 50%);
      pointer-events: none;
    }
    .wrap { max-width: 640px; text-align: left; position: relative; z-index: 1; }
    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--signal);
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .eyebrow::before {
      content: '';
      width: 28px;
      height: 1px;
      background: var(--signal);
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(80px, 16vw, 200px);
      line-height: 0.9;
      letter-spacing: -0.05em;
      font-weight: 600;
      margin-bottom: 32px;
    }
    h1 .accent { color: var(--signal); }
    p {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(22px, 3vw, 34px);
      line-height: 1.25;
      letter-spacing: -0.02em;
      margin-bottom: 40px;
      color: var(--frost);
    }
    a {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--frost);
      text-decoration: none;
      border-bottom: 1px solid var(--line-strong);
      padding-bottom: 4px;
      transition: all 0.2s ease;
    }
    a:hover { color: var(--signal); border-color: var(--signal); }
    a::before { content: '← '; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Error · 404</div>
    <h1>4<span class="accent">0</span>4</h1>
    <p>Not in the workshop's inventory.</p>
    <a href="/">Back to Værksted</a>
  </div>
</body>
</html>
