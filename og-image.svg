<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Bifröst glow, top -->
    <radialGradient id="glow1" cx="22%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#5B8DEF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#5B8DEF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="62%" cy="2%" r="48%">
      <stop offset="0%" stop-color="#B07CF6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#B07CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="92%" cy="6%" r="42%">
      <stop offset="0%" stop-color="#F2A33C" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#F2A33C" stop-opacity="0"/>
    </radialGradient>
    <!-- Bifröst gradient -->
    <linearGradient id="bifrost" x1="0" y1="0" x2="1" y2="0.18">
      <stop offset="0%" stop-color="#F26D6D"/>
      <stop offset="22%" stop-color="#F2A33C"/>
      <stop offset="44%" stop-color="#4FD08A"/>
      <stop offset="64%" stop-color="#38C5E0"/>
      <stop offset="82%" stop-color="#5B8DEF"/>
      <stop offset="100%" stop-color="#B07CF6"/>
    </linearGradient>
    <!-- Blueprint grid -->
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M 72 0 L 0 0 0 72" fill="none" stroke="#EDEFF3" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="1"/>
      <stop offset="70%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask">
      <rect width="1200" height="630" fill="url(#gridFade)"/>
    </mask>
  </defs>

  <!-- Void background -->
  <rect width="1200" height="630" fill="#0B0D11"/>
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect width="1200" height="630" fill="url(#glow3)"/>

  <!-- Top eyebrow -->
  <g transform="translate(80, 80)">
    <line x1="0" y1="14" x2="32" y2="14" stroke="url(#bifrost)" stroke-width="2"/>
    <text x="48" y="20"
          font-family="'JetBrains Mono', 'Courier New', monospace"
          font-size="16"
          font-weight="500"
          letter-spacing="3"
          fill="#5B8DEF">A WORKSHOP OF BUILDERS</text>
  </g>

  <!-- Wordmark -->
  <text x="78" y="350"
        font-family="'Space Grotesk', 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="232"
        font-weight="600"
        fill="#EDEFF3"
        letter-spacing="-10">V<tspan fill="url(#bifrost)">æ</tspan>rksted</text>

  <!-- Tagline -->
  <text x="80" y="452"
        font-family="'Space Grotesk', 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="44"
        font-weight="400"
        letter-spacing="-1"
        fill="#EDEFF3">We build AI-native apps. On principle.</text>

  <!-- Footer rule -->
  <line x1="80" y1="540" x2="1120" y2="540" stroke="#EDEFF3" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Footer meta -->
  <g transform="translate(80, 575)">
    <text x="0" y="0"
          font-family="'JetBrains Mono', 'Courier New', monospace"
          font-size="14"
          letter-spacing="2"
          fill="#8B939F">VAERKSTED.AI · KØBENHAVN · EST. MMXXVI</text>
  </g>
</svg>
